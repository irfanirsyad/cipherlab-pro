<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CipherLab Pro v1.2.0 - Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a1a; color: #eee; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: #2a2a2a; padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { color: #00d4ff; border-bottom: 2px solid #333; padding-bottom: 10px; }
        textarea { width: 100%; height: 150px; background: #111; color: #0f0; border: 1px solid #444; padding: 10px; border-radius: 5px; font-family: monospace; resize: none; }
        .controls { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
        button { padding: 12px 24px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-blue { background: #00d4ff; color: #000; }
        .btn-green { background: #00ff88; color: #000; }
        .btn-red { background: #ff4444; color: #fff; }
        button:hover { opacity: 0.8; transform: translateY(-2px); }
        .result-area { margin-top: 30px; }
        #output { background: #000; padding: 15px; border-radius: 8px; border-left: 5px solid #00d4ff; white-space: pre-wrap; word-break: break-all; min-height: 50px; }
        .status { font-size: 0.9em; color: #888; margin-top: 5px; }
        .api-key-input { margin-bottom: 20px; }
        input[type="text"] { background: #111; border: 1px solid #444; color: #eee; padding: 8px; border-radius: 4px; width: 250px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>CipherLab Pro <small style="font-size: 0.5em; color: #888;">v1.2.0 Titanium</small></h1>
        
        <div class="api-key-input">
            <label>API KEY: </label>
            <input type="text" id="apiKey" placeholder="Enter X-API-KEY" value="Ipanzx123">
        </div>

        <textarea id="input" placeholder="Paste your text or code here..."></textarea>
        
        <div class="controls">
            <button class="btn-blue" onclick="process('detect')">Auto Detect</button>
            <button class="btn-green" onclick="process('deobfuscate')">Deobfuscate JS</button>
            <button class="btn-blue" onclick="process('encrypt', 1)">Encrypt L1 (B64)</button>
            <button class="btn-blue" onclick="process('encrypt', 5)">Encrypt L5 (AES)</button>
            <button class="btn-red" onclick="clearAll()">Clear</button>
        </div>

        <div class="result-area">
            <h3>Output:</h3>
            <div id="output">Results will appear here...</div>
            <div id="status" class="status"></div>
        </div>
    </div>

    <script>
        async function process(action, level = 1) {
            const input = document.getElementById('input').value;
            const apiKey = document.getElementById('apiKey').value;
            const output = document.getElementById('output');
            const status = document.getElementById('status');
            
            if (!input) return alert('Please provide input');
            
            output.innerText = 'Processing...';
            status.innerText = `Calling /api/${action}...`;

            try {
                const endpoint = `/api/${action}`;
                const body = { input };
                if (action === 'encrypt') body.level = level;

                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'x-api-key': apiKey
                    },
                    body: JSON.stringify(body)
                });

                const data = await res.json();
                if (data.error) throw new Error(data.error);

                output.innerText = data.result ? data.result : JSON.stringify(data, null, 2);
                status.innerText = 'Success!';
            } catch (err) {
                output.innerText = `Error: ${err.message}`;
                status.innerText = 'Failed.';
            }
        }

        function clearAll() {
            document.getElementById('input').value = '';
            document.getElementById('output').innerText = 'Results will appear here...';
            document.getElementById('status').innerText = '';
        }
    </script>
</body>
</html>
